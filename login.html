<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DockFlow | Login</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Font Awesome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />

    <!-- Fonte Inter -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Sistema -->

    <link rel="stylesheet" href="frontend/css/login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="logo-area">
          <div class="logo-icon">
            <i class="fa-solid fa-truck-fast"></i>
          </div>

          <h1>Dock<span>Flow</span></h1>

          <p>Gestão inteligente de pátio e docas</p>
        </div>

        <!-- ESCOLHA PERFIL -->

        <div class="perfil-select">
          <button class="perfil ativo" id="btnMotorista">
            <span class="perfil-icone"><i class="bi bi-truck"></i></span>
            Motorista
          </button>

          <button class="perfil" id="btnFuncionario">
            <span class="perfil-icone"><i class="bi bi-person-workspace"></i></span>
            Funcionário
          </button>
        </div>

        <form id="formLogin">
          <div class="input-group mb-3">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>

            <input
              type="text"
              class="form-control"
              id="usuario"
              placeholder="CPF ou usuário"
              required
            />
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              id="senha"
              placeholder="Senha"
              required
            />

            <button type="button" class="btn btn-light" id="mostrarSenha">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <input class="form-check-input" type="checkbox" id="lembrar" />

              <label class="form-check-label"> Lembrar acesso </label>
            </div>

            <a href="#" id="recuperarSenha"> Esqueci minha senha </a>
          </div>

          <button class="btn btn-primary w-100 btn-login" type="submit">
            <i class="bi bi-box-arrow-in-right"></i>

            Entrar
          </button>
        </form>

        <hr />

        <button class="btn btn-outline-primary w-100" id="abrirCadastro">
          <i class="bi bi-person-plus"></i>

          Criar nova conta
        </button>

        <div class="footer-login">
          <p>© 2026 DockFlow</p>

          <span> Sistema de Controle Logístico </span>
        </div>
      </div>
    </div>

    <!-- MODAL CADASTRO -->

    <div class="modal fade" id="modalCadastro">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5>Criar Conta</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="formCadastro">
              <label> Nome completo </label>

              <input class="form-control mb-3" id="novoNome" />

              <label> CPF </label>

              <input class="form-control mb-3" id="novoCPF" />

              <label> Tipo de acesso </label>

              <select class="form-select mb-3" id="novoTipo">
                <option value="motorista">Motorista</option>

                <option value="funcionario">Funcionário</option>
              </select>

              <label> Criar senha </label>

              <input type="password" class="form-control mb-3" id="novaSenha" />

              <button class="btn btn-primary w-100">Cadastrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL RECUPERAÇÃO -->

    <div class="modal fade" id="modalSenha">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5>Recuperar senha</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <p>Informe seu CPF para recuperar o acesso.</p>

            <input class="form-control" id="cpfRecuperar" placeholder="CPF" />
          </div>

          <div class="modal-footer">
            <button class="btn btn-danger" id="btnRecuperar">Recuperar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="frontend/js/api.js"></script>
  <script src="frontend/js/login.js"></script>
  </body>
</html>
